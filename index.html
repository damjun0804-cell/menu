<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>˚₊‧꒰ა 미르의 메뉴판 ໒꒱ ‧₊˚</title>
  <style>
    :root {
      --bg-color: #fcf8f2;
      --card-bg: #ffffff;
      --primary: #ffb7b2;
      --primary-dark: #ff7880;
      --secondary: #e2f0cb;
      --accent: #b5ead7;
      --use-btn: #e65100;
      --text-main: #4a4a4a;
      --border-color: #f1e4d3;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 25px;
      color: #333;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-secondary { background-color: var(--secondary); color: #444; }
    .btn-accent { background-color: var(--accent); color: #444; }

    .btn-submit-purchase {
      background-color: var(--primary-dark);
      color: #ffffff;
    }
    .btn-submit-purchase:hover {
      background-color: #e0555e;
    }

    .btn-submit-use {
      background-color: var(--use-btn);
      color: #ffffff;
    }
    .btn-submit-use:hover {
      background-color: #bf4300;
    }

    .form-card {
      background-color: #faf8f5;
      border: 1px dashed var(--border-color);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .form-card h3 { margin-top: 0; font-size: 1.1rem; }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .section-title {
      font-size: 1.2rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 6px;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-item:last-child { border-bottom: none; }
    .menu-title { font-weight: 600; }
    .menu-price {
      background-color: #fff0f0;
      color: #e57373;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.9rem;
    }

    .tag-purchase { color: #2196F3; font-weight: bold; }
    .tag-use { color: #F44336; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>˚₊‧꒰ა 미르의 메뉴판 ໒꒱ ‧₊˚</h1>

    <!-- 컨트롤 버튼 -->
    <div class="btn-group">
      <button class="btn-secondary" onclick="toggleForm()">➕ 킵 추가 / 사용</button>
      <button class="btn-accent" onclick="openHistory()">📜 히스토리</button>
    </div>

    <!-- 킵 추가 / 사용 등록 폼 -->
    <div id="addFormCard" class="form-card" style="display: none;">
      <h3>📝 킵 등록 및 사용 인증</h3>
      
      <select id="actionType" onchange="switchFormType()">
        <option value="PURCHASE">적립하기</option>
        <option value="USE">사용하기</option>
      </select>

      <hr style="border:0; border-top: 1px dashed #ddd; margin: 10px 0;">

      <!-- 1. 적립 폼 -->
      <form id="purchaseForm">
        <select id="purchaseItemSelect" required>
          <option value="" disabled selected>메뉴 선택</option>
        </select>
        <input type="number" id="purchaseAmount" placeholder="수량 (개수)" min="1" required>
        <input type="text" id="purchaseUserName" placeholder="닉네임 (필수)" required>
        <input type="password" id="purchasePassword" placeholder="비밀번호 (숫자 4~8자리)" inputmode="numeric" pattern="^[0-9]{4,8}$" maxlength="8" title="숫자 4자리에서 8자리까지 입력해야 합니다." required>
        <button type="submit" class="btn-submit-purchase">적립 등록</button>
      </form>

      <!-- 2. 사용 폼 (닉네임 입력창 제거, 버튼명 및 색상 변경) -->
      <form id="useForm" style="display: none;">
        <select id="useKeepSelect" required>
          <option value="" disabled selected>보유 중인 킵 항목 선택</option>
        </select>
        <input type="number" id="useAmount" placeholder="사용 할 수량" min="1" required>
        <input type="password" id="usePassword" placeholder="비밀번호 (숫자 4~8자리)" inputmode="numeric" pattern="^[0-9]{4,8}$" maxlength="8" title="숫자 4자리에서 8자리까지 입력해야 합니다." required>
        <button type="submit" class="btn-submit-use">사용하기</button>
      </form>
    </div>

    <!-- 고정 메뉴판 영역 -->
    <div class="section-title">🥄 메뉴판</div>
    <ul id="regularMenuList" class="menu-list"></ul>

    <!-- 킵해둔 리액션 영역 -->
    <div class="section-title">✨ 킵해둔 리액션 목록</div>
    <ul id="reactionList" class="menu-list"></ul>
  </div>

  <!-- 히스토리 모달 -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">📅 사용 및 적립 기록</h3>
        <button onclick="closeHistory()">닫기</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- Firebase JavaScript SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const _0x4a = {
      k: "QUl6YVN5QlhockRTWGczeU1lSTAzV1JxczFWOFFrTDJhbUlwZ2Qw",
      d: "bWVudS1jOGRjNi5maXJlYmFzdG9yYWdlLmFwcA==",
      p: "bWVudS1jOGRjNg==",
      b: "bWVudS1jOGRjNi5maXJlYmFzdG9yYWdlLmFwcA==",
      m: "NTk2MzI0MDg5OTc5",
      a: "MTo1OTYzMjQwODk5Nzk6d2ViOjMzYzcxMTBiODQ2ZmVjMzZhYTIyZGU="
    };

    const firebaseConfig = {
      apiKey: atob(_0x4a.k),
      authDomain: atob(_0x4a.d),
      projectId: atob(_0x4a.p),
      storageBucket: atob(_0x4a.b),
      messagingSenderId: atob(_0x4a.m),
      appId: atob(_0x4a.a)
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fixedMenuList = [
      { title: "아잉", price: 1 },
      { title: "힝구", price: 5 },
      { title: "룰렛", price: 20 },
      { title: "멍멍체 5분", price: 30 },
      { title: "원하는 호칭 방종까지", price: 40 },
      { title: "원하는 말 읽어주기", price: 50 },
      { title: "팬보드", price: 100 },
      { title: "리방", price: 300 },
      { title: "커플프사", price: 500 }
    ];

    const regularMenuList = document.getElementById("regularMenuList");
    const reactionList = document.getElementById("reactionList");
    const historyList = document.getElementById("historyList");
    const purchaseItemSelect = document.getElementById("purchaseItemSelect");
    const useKeepSelect = document.getElementById("useKeepSelect");

    let keepBalances = {};

    function renderFixedMenu() {
      regularMenuList.innerHTML = "";
      fixedMenuList.forEach((item) => {
        const li = document.createElement("li");
        li.className = "menu-item";
        li.innerHTML = `<span class="menu-title">🥄 ${item.title}</span><span class="menu-price">${item.price}개</span>`;
        regularMenuList.appendChild(li);

        const option = document.createElement("option");
        option.value = item.title;
        option.textContent = `${item.title} (${item.price}개)`;
        purchaseItemSelect.appendChild(option);
      });
    }

    renderFixedMenu();

    const historyQuery = query(collection(db, "histories"), orderBy("createdAt", "desc"));
    onSnapshot(historyQuery, (snapshot) => {
      historyList.innerHTML = "";
      keepBalances = {};

      snapshot.docs.forEach((doc) => {
        const h = doc.data();
        const key = `${h.userName}_${h.itemName}`;

        if (!keepBalances[key]) {
          keepBalances[key] = {
            userName: h.userName,
            itemName: h.itemName,
            amount: 0,
            password: h.password
          };
        }

        if (h.type === "PURCHASE") {
          keepBalances[key].amount += h.amount;
          if (h.password) keepBalances[key].password = h.password;
        } else if (h.type === "USE") {
          keepBalances[key].amount -= h.amount;
        }

        const div = document.createElement("div");
        div.className = "history-item";
        const typeTag = h.type === "PURCHASE" 
          ? `<span class="tag-purchase">[적립]</span>` 
          : `<span class="tag-use">[사용]</span>`;
        const dateStr = h.createdAt?.toDate ? h.createdAt.toDate().toLocaleString("ko-KR") : "방금 전";

        div.innerHTML = `
          <div>${typeTag} <strong>${h.itemName}</strong> (${h.amount}개) - ${h.userName}</div>
          <small style="color: #999;">${dateStr}</small>
        `;
        historyList.appendChild(div);
      });

      reactionList.innerHTML = "";
      useKeepSelect.innerHTML = `<option value="" disabled selected>보유 중인 킵 항목 선택</option>`;
      
      const aggregateSummary = {};
      let hasReactions = false;

      for (const key in keepBalances) {
        const data = keepBalances[key];
        if (data.amount > 0) {
          hasReactions = true;

          if (!aggregateSummary[data.itemName]) {
            aggregateSummary[data.itemName] = 0;
          }
          aggregateSummary[data.itemName] += data.amount;

          const opt = document.createElement("option");
          opt.value = key;
          opt.textContent = `[${data.userName}] ${data.itemName} (남은 수량: ${data.amount}개)`;
          useKeepSelect.appendChild(opt);
        }
      }

      for (const [itemName, totalCount] of Object.entries(aggregateSummary)) {
        if (totalCount > 0) {
          const li = document.createElement("li");
          li.className = "menu-item";
          li.innerHTML = `<span class="menu-title">✨ ${itemName}</span><span class="menu-price">${totalCount}개 킵됨</span>`;
          reactionList.appendChild(li);
        }
      }

      if (!hasReactions) {
        reactionList.innerHTML = `<li class="menu-item" style="color:#999; justify-content:center;">현재 킵해둔 리액션이 없습니다.</li>`;
      }
    });

    const isValidPassword = (pwd) => /^[0-9]{4,8}$/.test(pwd);

    document.getElementById("purchaseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const itemName = purchaseItemSelect.value;
      const amount = Number(document.getElementById("purchaseAmount").value);
      const userName = document.getElementById("purchaseUserName").value.trim();
      const password = document.getElementById("purchasePassword").value.trim();

      if (!itemName) {
        alert("아이템을 선택해 주세요.");
        return;
      }

      if (!isValidPassword(password)) {
        alert("비밀번호는 반드시 숫자 4자리에서 8자리로 설정해야 합니다.");
        return;
      }

      await addDoc(collection(db, "histories"), {
        type: "PURCHASE",
        itemName,
        amount,
        userName,
        password,
        createdAt: serverTimestamp()
      });

      e.target.reset();
      alert("적립이 완료되었습니다.");
    });

    document.getElementById("useForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const selectedKey = useKeepSelect.value;
      const amount = Number(document.getElementById("useAmount").value);
      const password = document.getElementById("usePassword").value.trim();

      if (!selectedKey || !keepBalances[selectedKey]) {
        alert("올바른 킵 항목을 선택해 주세요.");
        return;
      }

      if (!isValidPassword(password)) {
        alert("비밀번호는 숫자 4자리에서 8자리 형식이어야 합니다.");
        return;
      }

      const targetKeep = keepBalances[selectedKey];

      if (targetKeep.password !== password) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      if (amount > targetKeep.amount) {
        alert(`보유 수량(${targetKeep.amount}개)을 초과하여 사용 할 수 없습니다.`);
        return;
      }

      await addDoc(collection(db, "histories"), {
        type: "USE",
        itemName: targetKeep.itemName,
        amount,
        userName: targetKeep.userName,
        createdAt: serverTimestamp()
      });

      e.target.reset();
      alert("사용이 완료되었습니다.");
    });

    window.switchFormType = () => {
      const type = document.getElementById("actionType").value;
      if (type === "PURCHASE") {
        document.getElementById("purchaseForm").style.display = "flex";
        document.getElementById("useForm").style.display = "none";
      } else {
        document.getElementById("purchaseForm").style.display = "none";
        document.getElementById("useForm").style.display = "flex";
      }
    };

    window.toggleForm = () => {
      const form = document.getElementById("addFormCard");
      form.style.display = form.style.display === "none" ? "block" : "none";
    };

    window.openHistory = () => {
      document.getElementById("historyModal").style.display = "flex";
    };

    window.closeHistory = () => {
      document.getElementById("historyModal").style.display = "none";
    };
  </script>
</body>
</html>
