<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>˚₊‧꒰ა 미르의 메뉴판 ໒꒱ ‧₊˚</title>
  <style>
    :root {
      --bg-color: #fcf8f2;
      --card-bg: #ffffff;
      --primary: #ffb7b2;
      --primary-hover: #ff9aa2;
      --secondary: #e2f0cb;
      --accent: #b5ead7;
      --text-main: #4a4a4a;
      --border-color: #f1e4d3;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 25px;
      color: #333;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-secondary { background-color: var(--secondary); color: #444; }
    .btn-accent { background-color: var(--accent); color: #444; }

    .form-card {
      background-color: #faf8f5;
      border: 1px dashed var(--border-color);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .form-card h3 { margin-top: 0; font-size: 1.1rem; }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .section-title {
      font-size: 1.2rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 6px;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-item:last-child { border-bottom: none; }
    .menu-title { font-weight: 600; }
    .menu-price {
      background-color: #fff0f0;
      color: #e57373;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.9rem;
    }

    .tag-purchase { color: #2196F3; font-weight: bold; }
    .tag-use { color: #F44336; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>˚₊‧꒰ა 미르의 메뉴판 ໒꒱ ‧₊˚</h1>

    <!-- 컨트롤 버튼 -->
    <div class="btn-group">
      <button class="btn-secondary" onclick="toggleForm()">➕ 킵 추가 / 사용 등록</button>
      <button class="btn-accent" onclick="openHistory()">📜 히스토리 보기</button>
    </div>

    <!-- 킵 추가 / 사용 기록 등록 폼 -->
    <div id="addFormCard" class="form-card" style="display: none;">
      <h3>📝 킵 리액션 추가 및 사용 기록</h3>
      <form id="historyForm">
        <select id="historyType">
          <option value="PURCHASE">적립</option>
          <option value="USE">사용</option>
        </select>
        
        <!-- 아이템 선택 드롭다운 -->
        <select id="historyItemSelect" required>
          <option value="" disabled selected>아이템을 선택하세요</option>
        </select>
        
        <input type="number" id="historyAmount" placeholder="수량 (개수)" required>
        <!-- 닉네임 필수 입력으로 변경 -->
        <input type="text" id="historyUserName" placeholder="닉네임 (필수)" required>
        <button type="submit" class="btn-secondary">기록 등록</button>
      </form>
    </div>

    <!-- 고정 메뉴판 영역 -->
    <div class="section-title">🥄 메뉴판</div>
    <ul id="regularMenuList" class="menu-list"></ul>

    <!-- 킵해둔 리액션 영역 -->
    <div class="section-title">✨ 킵해둔 리액션 목록</div>
    <ul id="reactionList" class="menu-list"></ul>
  </div>

  <!-- 히스토리 모달 -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">📅 사용 및 구매 기록</h3>
        <button onclick="closeHistory()">닫기</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- Firebase JavaScript SDK (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Base64로 난독화된 Firebase 키 정보
    const _0x4a = {
      k: "QUl6YVN5QlhockRTWGczeU1lSTAzV1JxczFWOFFrTDJhbUlwZ2Qw",
      d: "bWVudS1jOGRjNi5maXJlYmFzZWFwcC5jb20=",
      p: "bWVudS1jOGRjNg==",
      b: "bWVudS1jOGRjNi5maXJlYmFzdG9yYWdlLmFwcA==",
      m: "NTk2MzI0MDg5OTc5",
      a: "MTo1OTYzMjQwODk5Nzk6d2ViOjMzYzcxMTBiODQ2ZmVjMzZhYTIyZGU="
    };

    const firebaseConfig = {
      apiKey: atob(_0x4a.k),
      authDomain: atob(_0x4a.d),
      projectId: atob(_0x4a.p),
      storageBucket: atob(_0x4a.b),
      messagingSenderId: atob(_0x4a.m),
      appId: atob(_0x4a.a)
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 고정 메뉴판 데이터 목록
    const fixedMenuList = [
      { title: "아잉", price: 1 },
      { title: "힝구", price: 5 },
      { title: "룰렛", price: 20 },
      { title: "멍멍체 5분", price: 30 },
      { title: "원하는 호칭 방종까지", price: 40 },
      { title: "원하는 말 읽어주기", price: 50 },
      { title: "팬보드", price: 100 },
      { title: "리방", price: 300 },
      { title: "커플프사", price: 500 }
    ];

    const regularMenuList = document.getElementById("regularMenuList");
    const reactionList = document.getElementById("reactionList");
    const historyList = document.getElementById("historyList");
    const historyItemSelect = document.getElementById("historyItemSelect");

    // 1. 고정 메뉴판 출력 및 셀렉트 박스 옵션 생성 함수
    function renderFixedMenu() {
      regularMenuList.innerHTML = "";
      fixedMenuList.forEach((item) => {
        // 메뉴판 출력
        const li = document.createElement("li");
        li.className = "menu-item";
        li.innerHTML = `<span class="menu-title">🥄 ${item.title}</span><span class="menu-price">${item.price}개</span>`;
        regularMenuList.appendChild(li);

        // 드롭다운 셀렉트 박스 옵션 추가
        const option = document.createElement("option");
        option.value = item.title;
        option.textContent = `${item.title} (${item.price}개)`;
        historyItemSelect.appendChild(option);
      });
    }

    renderFixedMenu();

    // 2. Firestore 실시간 킵해둔 리액션 목록 계산 및 동기화
    const historyQuery = query(collection(db, "histories"), orderBy("createdAt", "desc"));
    onSnapshot(historyQuery, (snapshot) => {
      historyList.innerHTML = "";
      const reactionBalances = {};

      snapshot.docs.forEach((doc) => {
        const h = doc.data();
        
        if (!reactionBalances[h.itemName]) {
          reactionBalances[h.itemName] = 0;
        }
        if (h.type === "PURCHASE") {
          reactionBalances[h.itemName] += h.amount;
        } else if (h.type === "USE") {
          reactionBalances[h.itemName] -= h.amount;
        }

        // 히스토리 모달 목록 랜더링
        const div = document.createElement("div");
        div.className = "history-item";
        const typeTag = h.type === "PURCHASE" 
          ? `<span class="tag-purchase">[적립]</span>` 
          : `<span class="tag-use">[사용]</span>`;
        const dateStr = h.createdAt?.toDate ? h.createdAt.toDate().toLocaleString("ko-KR") : "방금 전";

        div.innerHTML = `
          <div>${typeTag} <strong>${h.itemName}</strong> (${h.amount}개) - ${h.userName}</div>
          <small style="color: #999;">${dateStr}</small>
        `;
        historyList.appendChild(div);
      });

      // 계산된 킵 리액션 목록 화면 출력
      reactionList.innerHTML = "";
      let hasReactions = false;
      
      for (const [title, count] of Object.entries(reactionBalances)) {
        if (count > 0) {
          hasReactions = true;
          const li = document.createElement("li");
          li.className = "menu-item";
          li.innerHTML = `<span class="menu-title">✨ ${title}</span><span class="menu-price">${count}개 킵됨</span>`;
          reactionList.appendChild(li);
        }
      }

      if (!hasReactions) {
        reactionList.innerHTML = `<li class="menu-item" style="color:#999; justify-content:center;">현재 킵해둔 리액션이 없습니다.</li>`;
      }
    });

    // 3. 킵/사용 내역 등록 폼 제출
    document.getElementById("historyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = document.getElementById("historyType").value;
      const itemName = historyItemSelect.value;
      const amount = Number(document.getElementById("historyAmount").value);
      const userName = document.getElementById("historyUserName").value.trim();

      if (!itemName) {
        alert("아이템을 선택해 주세요.");
        return;
      }

      await addDoc(collection(db, "histories"), {
        type, itemName, amount, userName, createdAt: serverTimestamp()
      });

      e.target.reset();
      alert("내역이 등록되었습니다.");
    });

    // 버튼 핸들러
    window.toggleForm = () => {
      const form = document.getElementById("addFormCard");
      form.style.display = form.style.display === "none" ? "block" : "none";
    };

    window.openHistory = () => {
      document.getElementById("historyModal").style.display = "flex";
    };

    window.closeHistory = () => {
      document.getElementById("historyModal").style.display = "none";
    };
  </script>
</body>
</html>
